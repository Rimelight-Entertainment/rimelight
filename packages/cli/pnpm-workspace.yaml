minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "@rimelight/*"
  - "astro"
  - "@astrojs/*"
saveExact: true
packageImportMethod: copy
strictSsl: true
overrides:
  # Dependencies failing pnpm audit
  fast-uri: "3.1.2"
  fast-xml-parser: "4.4.1"
  devalue: "5.8.1"
  brace-expansion: "5.0.6"
  ws@8: "8.20.1"
  undici: "7.28.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
