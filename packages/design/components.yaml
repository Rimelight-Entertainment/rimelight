# Rimelight cross-platform component catalogue (draft)
# Counts (distinct concepts):
#   total concepts:           156
#   done on web and slint:    55
#   web-only (web done):      71
#   slint-only (slint done):  30  (ActionRow, Tile and RecentList added in WS4 ST4.2; ListPage, BoardPage, DetailPage in WS5 ST5.4)
#   media-only (media done):  0  (Tile, RecentList and ActionRow now also in rimelight_ui)
# Sources: packages/ui/src/components (web), crates/rimelight_ui/ui/components (slint),
#          rimelight-media/ui/widgets.slint (media). Read-only research.
# Unclassified (no component export): Slint ClipboardWriter, ConnectionState, InputFocus;
#          Media globals TipBounds, ShortcutsCtl (only a helper global for the Shortcuts dialog).

# ---------- action ----------

- name: Button
  aliases: [button, Button]
  category: action
  web:
    {
      status: done,
      path: packages/ui/src/components/button,
      props:
        [
          label,
          leadingIcon,
          trailingIcon,
          loading,
          loadingAuto,
          active,
          activeVariant,
          shape,
          avatar,
        ],
    }
  slint:
    {
      status: done,
      path: crates/rimelight_ui/ui/components/button.slint,
      props:
        [
          text,
          variant,
          size,
          leading-icon,
          trailing-icon,
          loading,
          checkable,
          selected,
          enabled,
          full-width,
          square,
          grouped,
          ghost-toggle,
          on-sidebar,
        ],
    }
  media: { status: done, path: ui/widgets.slint#Button, props: [text, icon, kind, enabled] }
  notes: "Web label/leadingIcon vs Slint text/leading-icon. Variants: Slint primary/secondary/ghost/danger/link; Media ButtonKind primary/secondary/ghost/danger. ST3.3 (web): the web Button already uses the D5 vocabulary (variant solid/outline/soft/subtle/ghost/link/unstyled, colour from the palettes, size xs-xl, defaults solid/primary/md). The web had no primary/secondary/danger variants; consumers passed them, so they are now deprecated aliases (solid+primary, outline+neutral, solid+error). Slint and Media still use the old names: change them under WS2, not here."

