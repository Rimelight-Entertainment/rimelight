packages:
  - "apps/*"
  - "packages/*"
configDependencies:
  "@pnpm/pacquet": 0.11.12
linkWorkspacePackages: true
supportedArchitectures:
  cpu:
    - current
    - wasm32
packageImportMethod: copy
saveExact: true
minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "@rimelight/*"
overrides:
  # Vulnerability Fixes
  esbuild: ">=0.24.3"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
