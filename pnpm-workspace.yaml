packages:
  - "packages/*"
preferWorkspacePackages: true
linkWorkspacePackages: true
saveWorkspaceProtocol: false
minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "pnpm"
  - "astro"
  - "@astrojs/*"
  - "@rimelight/*"
saveExact: true
packageImportMethod: copy
strictSsl: true
overrides:
  kysely: "0.28.17"
  vite-plus: latest
  vite: "npm:@voidzero-dev/vite-plus-core@latest"
  ws: "^8.21.0"
  esbuild: "0.28.1"
  yaml: "^2.8.3"
  js-yaml: "^4.1.2"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    "astro-nanostores-i18n>astro": ">=6.0.0 || >=7.0.0-alpha.0"
    "astro-expressive-code>astro": ">=6.0.0 || >=7.0.0-alpha.0"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
configDependencies:
  "@pnpm/pacquet": 0.11.9
