packages:
  - "apps/*"
  - "packages/*"
linkWorkspacePackages: true
supportedArchitectures:
  cpu:
    - current
    - wasm32
packageImportMethod: copy
saveExact: true
minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "@rimelight/*"
overrides:
  # Vulnerability Fixes
  esbuild: ">=0.24.3"
allowBuilds:
  esbuild: true
  workerd: true
